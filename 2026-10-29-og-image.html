<!doctype html><html lang="ko"><meta charset="utf-8"><title>MusicStep OG artwork</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#0b0e11;color:#eaecef;font-family:Arial,'Malgun Gothic',sans-serif;padding:54px 64px;overflow:hidden}.brand{font-size:32px;font-weight:700;letter-spacing:-1px;display:flex;align-items:center;gap:14px}.mark{display:flex;align-items:flex-end;gap:4px;height:28px}.mark i{display:block;background:#fcd535;width:9px;border-radius:2px}.mark i:nth-child(1){height:16px}.mark i:nth-child(2){height:28px}.mark i:nth-child(3){height:21px}.privacy{position:absolute;right:64px;top:64px;font-size:17px;color:#a3acb9;display:flex;align-items:center;gap:9px}.privacy b{width:7px;height:7px;background:#30d99a;border-radius:50%}.content{display:flex;gap:48px;margin-top:68px;align-items:center}.copy{width:505px;flex:none}.eyebrow{font-size:18px;color:#fcd535;font-weight:600;margin-bottom:22px}h1{font-size:62px;line-height:1.25;letter-spacing:-3px;margin:0;font-weight:700}h1 span{color:#fcd535}.description{font-size:20px;line-height:1.7;color:#a3acb9;margin:25px 0 0;letter-spacing:-.4px}.card{width:493px;background:#181a20;border:1px solid #39414e;border-radius:16px;padding:25px 24px;position:relative}.card-title{font-size:15px;color:#a3acb9;display:flex;justify-content:space-between;align-items:center}.badge{font-size:13px;color:#30d99a;background:#142b25;border:1px solid #265845;border-radius:5px;padding:6px 10px}.wave{height:100px;margin:22px 0 14px;background:#0b0e11;border-radius:6px;position:relative;overflow:hidden}.bars{display:flex;align-items:center;gap:3px;height:100%;padding:0 10px}.bar{width:3px;flex:none;background:#687381}.bar.voice{background:#d4bd53}.line{position:absolute;top:0;bottom:0;left:38%;width:2px;background:#fcd535}.cue{display:flex;align-items:center;gap:12px;border:1px solid #50503a;border-radius:6px;padding:16px;background:#25251b;font-size:18px}.cue b{color:#fcd535;font-variant-numeric:tabular-nums}.cue span{color:#c8cdd4}.hint{color:#a3acb9;font-size:14px;margin-top:15px}.footer{position:absolute;left:64px;right:64px;bottom:44px;border-top:1px solid #292e36;padding-top:20px;display:flex;justify-content:space-between;font-size:15px;letter-spacing:.2px;color:#a3acb9}.footer strong{font-weight:400;color:#eaecef}
</style>
<body><div class="brand"><span class="mark"><i></i><i></i><i></i></span>MusicStep</div><div class="privacy"><b></b>브라우저 안에서만 처리</div><div class="content"><section class="copy"><div class="eyebrow">플레이리스트 자막 맞추기</div><h1>첫 가사부터,<br><span>정확하게.</span></h1><p class="description">보컬 시작을 찾아 자막을 맞추고<br>음악과 SRT를 한 번에 내보내세요.</p></section><section class="card"><div class="card-title">감지한 목소리 시작<span class="badge">자동 완료</span></div><div class="wave"><div class="bars" id="bars"></div><div class="line"></div></div><div class="cue"><b>00:12.000</b><span>첫 가사 시작</span></div><div class="hint">음악 · SRT 불러오기 → 분석 → 내보내기</div></section></div><div class="footer"><strong>여러 곡을 한 번에. 첫 자막은 제자리에.</strong><span>음악 · 파형 · 자막, 업로드 없이</span></div>
<script>for(let i=0;i<72;i++){let b=document.createElement('i');b.className='bar'+(i>=26?' voice':'');b.style.height=(i<26?10+Math.abs(Math.sin(i*2.3))*19:18+Math.abs(Math.sin(i*.8)*Math.cos(i*.31))*65)+'px';document.querySelector('#bars').append(b)}</script>
